<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoCare - Maintenance Schedule</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.16.29/font/lucide.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --moto-green: #2E9E4F; }
        body { font-family: ui-sans-serif, system-ui, sans-serif; }
        .schedule-header { background: var(--moto-green); }
        .header-action { position: relative; display: grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 50%; color: #fff; background: rgba(255, 255, 255, 0.18); cursor: pointer; }
        .header-action:hover { background: rgba(255, 255, 255, 0.26); }
        .header-action:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.85); outline-offset: 2px; }
        .header-action svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
        .notification-badge { position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px; padding: 0 4px; border: 2px solid var(--moto-green); border-radius: 999px; color: #fff; background: #ef4444; font: 700 9px/13px sans-serif; text-align: center; }
        .schedule-tab { flex: 1 1 auto; min-height: 36px; border: 1px solid var(--moto-green); border-radius: 999px; padding: 0 12px; color: var(--moto-green); background: transparent; font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; }
        .schedule-tab.is-active { color: #fff; background: var(--moto-green); }
        .schedule-tab:focus-visible { outline: 3px solid rgba(46, 158, 79, 0.28); outline-offset: 2px; }
        .schedule-card { border: 1px solid #edf0f1; border-radius: 12px; background: #fff; box-shadow: 0 5px 18px rgba(30, 51, 38, 0.07); }
        .schedule-icon { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 42px; border-radius: 50%; color: var(--moto-green); background: #eaf7ed; }
        .schedule-label { color: #9aa2a8; font-size: 9px; font-weight: 800; letter-spacing: .08em; }
        .schedule-status { border-radius: 999px; padding: 5px 9px; font-size: 9px; font-weight: 800; white-space: nowrap; }
        .schedule-status--overdue { color: #b42318; background: #fee4e2; }
        .schedule-status--due { color: #a15c00; background: #fff0cc; }
        .schedule-status--upcoming { color: #1d5fa7; background: #e3f0ff; }
        .schedule-status--ok { color: #237a3a; background: #e5f6e9; }
        .schedule-status--scheduled { color: #1d5fa7; background: #e3f0ff; }
        @media (max-width: 420px) {
            .schedule-header h1 { font-size: 20px; line-height: 1.2; }
            .schedule-header .header-action { width: 34px; height: 34px; }
            .schedule-header .header-action svg { width: 17px; height: 17px; }
            .schedule-header > div { gap: 6px; }
            .schedule-header > div > div:last-child { gap: 4px; }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 pb-32 text-gray-800">
    <header class="schedule-header px-4 pb-12 pt-5 text-white">
        <div class="mx-auto flex max-w-lg items-start justify-between gap-3">
                <div class="min-w-0">
                    <p class="text-xs font-medium text-green-100">Keep your ride ready</p>
                    <h1 class="mt-1 text-2xl font-bold">Maintenance Schedule</h1>
                    <p id="overdueSubtitle" class="mt-1 text-xs text-green-50">0 overdue</p>
                    <p id="selectedMotorcycleLabel" class="mt-3 max-w-full truncate text-xs font-semibold text-green-900"></p>
                </div>
                <div class="flex items-center gap-2">
                    <button id="notificationBtn" type="button" aria-label="Notifications" class="header-action"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg><span id="notificationBadge" class="notification-badge hidden"></span></button>
                    <button id="logoutBtn" type="button" aria-label="Log out" class="header-action"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7" /><path d="M12 12h9M17 8l4 4-4 4" /></svg></button>
                    <button id="motorcycleDrawerButton" type="button" class="header-action" aria-label="Open motorcycle selector">
                        <i class="lucide lucide-bike text-lg" aria-hidden="true"></i>
                    </button>
                </div>
        </div>
    </header>

    <main class="mx-auto max-w-lg space-y-4 px-3 pt-4">
            <nav class="flex gap-2 overflow-x-auto pb-1" aria-label="Maintenance filters">
                <button type="button" class="schedule-tab is-active" data-schedule-filter="all">All</button>
                <button type="button" class="schedule-tab" data-schedule-filter="overdue">Overdue</button>
                <button type="button" class="schedule-tab" data-schedule-filter="due-soon">Due Soon</button>
                <button type="button" class="schedule-tab" data-schedule-filter="upcoming">Upcoming</button>
            </nav>

            <section id="scheduleList" class="space-y-3" aria-live="polite">
                <p class="py-8 text-center text-sm text-gray-500">Loading maintenance reminders...</p>
            </section>
    </main>

    <!-- Motorcycle Drawer -->
    <div id="motorcycleDrawerBackdrop" class="fixed inset-0 bg-black/40 hidden z-40"></div>
    <aside id="motorcycleDrawer" class="fixed top-0 left-0 h-full w-[86%] max-w-sm bg-white shadow-2xl z-50 hidden -translate-x-full transition-transform duration-200 ease-out">
        <div class="p-4 border-b border-gray-100 flex items-center justify-between">
            <div>
                <h2 class="text-lg font-semibold text-gray-800">Select Unit</h2>
                <p class="text-xs text-gray-500 mt-1">Choose one motorcycle to view its reminders</p>
            </div>
            <button id="motorcycleDrawerCloseButton" type="button" class="w-9 h-9 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center" aria-label="Close motorcycle selector">
                <i class="lucide lucide-x text-lg"></i>
            </button>
        </div>
        <div class="p-4 space-y-3 overflow-y-auto h-[calc(100%-73px)]" id="motorcycleDrawerList">
            <div class="text-sm text-gray-500">Loading motorcycles...</div>
        </div>
    </aside>

    <div id="mobileNav"></div>

    <!-- Floating Action Button -->
    <a href="add-record.html" class="fixed bottom-24 right-4 bg-green-700 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-xl hover:bg-green-800 transition-all hover:scale-110 active:scale-95 z-30">
        <i class="lucide lucide-plus text-3xl"></i>
    </a>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2 max-w-sm"></div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="module" src="./js/firebase-config.js"></script>
    <script src="./js/utils.js"></script>
    <script type="module" src="./js/mobile-nav.js"></script>
    <script type="module" src="./js/notification-panel.js"></script>
    <script type="module" src="./js/schedule.js"></script>
</body>
</html>
