<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoCare - MotoAI</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/shared-layout.css?v=3">
    <style>
        * { box-sizing: border-box; }
        html { background: var(--moto-bg); }
        body { min-width: 320px; min-height: 100dvh; margin: 0; overflow: hidden; color: var(--moto-text); background: var(--moto-bg); font-family: var(--moto-font); -webkit-font-smoothing: antialiased; }
        .motoai-context, #mobileNav { display: none; }
        .motoai-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: block;
            background: var(--moto-bg);
        }
        .motoai-sheet {
            width: min(100%, 480px);
            height: 100dvh;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 0;
            background: var(--moto-bg);
        }
        .motoai-sheet__inner { display: flex; flex-direction: column; height: 100%; }
        .motoai-header { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; padding: 28px 16px 24px; border-radius: 0 0 14px 14px; background: var(--moto-surface); }
        .motoai-header__badge, .motoai-avatar {
            display: grid;
            flex: 0 0 auto;
            place-items: center;
            color: #fff;
            background: var(--moto-primary);
        }
        .motoai-header__badge { width: 44px; height: 44px; border-radius: 50%; }
        .motoai-header__badge svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
        .motoai-avatar { display: none; }
        .motoai-header__content { min-width: 0; flex: 1; }
        .motoai-title-row { display: flex; align-items: center; gap: 7px; }
        .motoai-title { color: var(--moto-text); font-size: 15px; font-weight: 600; line-height: 1.2; }
        .motoai-ai-pill { display: none; }
        .motoai-online { margin: 3px 0 0; color: var(--moto-primary); font-size: 9px; font-weight: 500; line-height: 1; }
        .motoai-close { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; color: var(--moto-muted); background: transparent; cursor: pointer; }
        .motoai-close:hover, .motoai-close:active { background: var(--moto-icon-tile); }
        .motoai-close svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
        .motoai-chat { display: flex; align-items: flex-end; gap: 7px; margin-top: 14px; }
        .motoai-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 8px; scrollbar-width: none; }
        .motoai-messages::-webkit-scrollbar { display: none; }
        .motoai-date { margin: 2px 0 14px; color: var(--moto-muted); font-size: 8px; text-align: center; }
        .motoai-message { max-width: 85%; margin: 0; padding: 12px; border-radius: 4px 20px 20px 20px; color: var(--moto-text); background: var(--moto-icon-tile); font-size: 10px; font-weight: 400; line-height: 1.45; animation: motoai-message-in 180ms ease-out; }
        .motoai-response { width: fit-content; max-width: 80%; margin: 14px 0 0 auto; padding: 12px; border-radius: 20px 4px 20px 20px; color: #fff; background: var(--moto-primary); font-size: 10px; font-weight: 400; line-height: 1.35; }
        .motoai-rich-card { margin-top: 18px; padding: 16px; border-radius: var(--moto-radius-card); background: var(--moto-surface); box-shadow: 0 2px 10px rgba(17, 22, 19, .04); }
        .motoai-rich-card h2 { margin: 0; color: var(--moto-text); font-size: 12px; font-weight: 600; line-height: 1.3; }
        .motoai-rich-card__subtitle { margin: 8px 0 0; color: var(--moto-primary); font-size: 10px; }
        .motoai-rich-card__body { margin: 8px 0 0; color: var(--moto-muted); font-size: 10px; line-height: 1.45; }
        .motoai-rich-card__link { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--moto-border); color: var(--moto-primary); font-size: 9px; font-weight: 500; text-decoration: none; }
        .motoai-rich-card__link svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
        .motoai-disclaimer { flex: 0 0 auto; margin: 0 16px 8px; color: var(--moto-muted); font-size: 8px; }
        .motoai-quick-label { display: none; }
        .motoai-suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 8px; flex: 0 0 auto; padding: 8px 16px 8px; }
        .motoai-suggestion { min-width: 0; min-height: 24px; overflow: hidden; padding: 5px 9px; border: 0; border-radius: 999px; color: var(--moto-muted); background: var(--moto-surface); font-size: 8px; font-weight: 400; text-align: left; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; transition: background 160ms ease, transform 160ms ease; }
        .motoai-suggestion:hover { background: var(--moto-icon-tile); }
        .motoai-suggestion:active { transform: scale(0.97); }
        .motoai-input-bar { display: flex; flex: 0 0 auto; gap: 8px; margin: 0; padding: 8px 14px max(12px, env(safe-area-inset-bottom)); background: var(--moto-bg); }
        .motoai-input { min-width: 0; flex: 1; height: 40px; border: 0; outline: 0; padding: 0 14px; border-radius: 999px; color: var(--moto-text); background: var(--moto-icon-tile); font-size: 10px; }
        .motoai-input::placeholder { color: var(--moto-muted); }
        .motoai-send { display: grid; place-items: center; width: 48px; height: 48px; flex: 0 0 48px; border: 0; border-radius: 50%; color: #fff; background: var(--moto-primary); cursor: pointer; }
        .motoai-send svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
        .motoai-send:hover { background: var(--moto-deep); }
        @keyframes motoai-message-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @media (min-width: 600px) { .motoai-sheet { margin: 0 auto; } }
    </style>
</head>
<body class="min-h-screen bg-gray-100 pb-32">
    <div class="motoai-backdrop" id="motoAiBackdrop">
        <section class="motoai-sheet" role="dialog" aria-modal="true" aria-labelledby="motoAiTitle">
            <div class="motoai-sheet__inner">
                <header class="motoai-header">
                    <div class="motoai-header__badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.4 5.6L19 10l-5.6 1.4L12 17l-1.4-5.6L5 10l5.6-1.4L12 3Z"></path><path d="m19 15 .7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15Z"></path></svg></div>
                    <div class="motoai-header__content">
                        <div class="motoai-title-row"><h1 id="motoAiTitle" class="motoai-title">MotoAI</h1><span class="motoai-ai-pill">AI</span></div>
                        <p class="motoai-online">● Online</p>
                    </div>
                    <button id="motoAiClose" class="motoai-close" type="button" aria-label="Close MotoAI"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 5 L19 19"/><path d="M19 5 L5 19"/></svg></button>
                </header>

                <div id="motoAiMessages" class="motoai-messages" aria-live="polite">
                    <p class="motoai-date">TODAY</p>
                    <div class="motoai-chat">
                        <div class="motoai-avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 18.5 4 21l.8-4.1A8 8 0 1 1 7.5 18.5Z"/></svg></div>
                        <p class="motoai-message">Kumusta! I'm MotoAI — your smart maintenance assistant. Ask me anything about your bike's upkeep, schedules, or what to check next.</p>
                    </div>
                </div>

                <p class="motoai-disclaimer">MotoAI offers guidance, not a mechanic's diagnosis.</p>
                <p class="motoai-quick-label">Quick questions:</p>
                <div class="motoai-suggestions">
                    <button type="button" data-motoai-prompt="Kailan palitan ang oil?" class="motoai-suggestion">Kailan palitan ang oil?</button>
                    <button type="button" data-motoai-prompt="Check brake pads?" class="motoai-suggestion">Check brake pads?</button>
                    <button type="button" data-motoai-prompt="Mileage tips?" class="motoai-suggestion">Mileage tips?</button>
                    <button type="button" data-motoai-prompt="Next major service?" class="motoai-suggestion">Next major service?</button>
                </div>

                <form id="motoAiForm" class="motoai-input-bar">
                    <label class="sr-only" for="motoAiPrompt">Ask about your bike</label>
                    <input id="motoAiPrompt" class="motoai-input" type="text" required maxlength="180" placeholder="Ask about your bike">
                    <button class="motoai-send" type="submit" aria-label="Send message"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 4.5 L21 12 L3.5 19.5 L6.5 12 Z"/><path d="M6.5 12 H21"/></svg></button>
                </form>
            </div>
        </section>
    </div>

    <div id="mobileNav"></div>

    <script type="module" src="./js/firebase-config.js?v=3"></script>
    <script src="./js/utils.js"></script>
    <script type="module" src="./js/mobile-nav.js?v=2"></script>
    <script type="module" src="./js/motoai.js?v=2"></script>
</body>
</html>
