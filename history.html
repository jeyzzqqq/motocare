<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7f5">
    <script src="./js/theme-init.js?v=1"></script>
    <title>MotoCare - Repair history</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/shared-layout.css?v=3">
    <link rel="stylesheet" href="./css/history.css?v=1">
    <link rel="stylesheet" href="./css/theme-dark.css?v=1">
</head>
<body>
    <main class="repair-history">
        <header class="repair-history__header">
            <div>
                <h1>Repair history</h1>
                <p>Keep track of fixes, big and small</p>
            </div>
            <a class="repair-history__add" href="add-record.html" aria-label="Add repair">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </a>
        </header>

        <section id="historySummary" class="repair-history__summary" aria-label="Repair cost summary" hidden>
            <div>
                <p class="repair-history__eyebrow">Total repair cost</p>
                <p id="totalHistorySpent" class="repair-history__total"></p>
            </div>
            <p id="totalRepairs" class="repair-history__count"></p>
        </section>

        <label class="repair-history__search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <span class="sr-only">Search repairs</span>
            <input id="searchInput" type="search" placeholder="Search repairs..." autocomplete="off">
        </label>

        <p id="historyLoading" class="repair-history__state" role="status">Loading repairs…</p>
        <section id="historyError" class="repair-history__state" role="alert" hidden>
            <p>Couldn't load repair history. Check your connection and try again.</p>
            <button id="historyRetry" type="button" class="repair-history__retry">Retry</button>
        </section>
        <div id="historyList" class="repair-history__list" hidden></div>
    </main>

    <div id="mobileNav"></div>
    <div id="toastContainer" aria-live="polite"></div>

    <script type="module" src="./js/firebase-config.js?v=3"></script>
    <script type="module" src="./js/theme-auth.js?v=1"></script>
    <script src="./js/utils.js"></script>
    <script type="module" src="./js/mobile-nav.js?v=2"></script>
    <script type="module" src="./js/motoai.js?v=4"></script>
    <script type="module" src="./js/add-record-overlay.js"></script>
    <script type="module" src="./js/history.js?v=1"></script>
</body>
</html>
