<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoCare - Profile</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.16.29/font/lucide.min.css" rel="stylesheet">
    <style>
        :root { --moto-green: #2e9e4f; }
        body { font-family: sans-serif; }
        .profile-header { background: #2e9e4f; }
        .profile-avatar { display: grid; place-items: center; width: 64px; height: 64px; overflow: hidden; border-radius: 50%; color: #fff; background: rgba(255, 255, 255, 0.2); }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-streak { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 9px; color: #fff; background: rgba(255, 255, 255, 0.18); font-size: 11px; font-weight: 700; }
        .profile-card { border: 1px solid #edf0ee; border-radius: 14px; background: #fff; box-shadow: 0 4px 14px rgba(31, 35, 32, 0.08); }
        .streak-day { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: #a5acb5; background: #f1f3f5; font-size: 11px; font-weight: 700; }
        .streak-day.is-complete { color: #fff; background: #2e9e4f; font-size: 15px; }
        .menu-row { min-height: 64px; }
        .menu-row + .menu-row { border-top: 1px solid #edf0ee; }
        .menu-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #2e9e4f; background: #e7f8eb; }
        .motoai-banner { background: linear-gradient(110deg, #8b5cf6, #9d20f3); }
        .motoai-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #fff; background: rgba(255, 255, 255, 0.2); }
        .ai-pill { padding: 3px 7px; border-radius: 999px; color: #fff; background: rgba(255, 255, 255, 0.2); font-size: 9px; font-weight: 700; }
    </style>
</head>
<body class="min-h-screen bg-gray-50 pb-32 text-gray-800">
    <header class="profile-header px-4 pb-12 pt-5 text-center text-white"><div class="mx-auto flex max-w-lg flex-col items-center"><div id="profileAvatar" class="profile-avatar" aria-label="Profile photo"><i class="lucide lucide-user-round text-2xl" aria-hidden="true"></i></div><h1 id="profileName" class="mt-2 text-xl font-bold">Rider</h1><p id="profileEmail" class="mt-1 text-xs text-green-50">Loading account...</p><div class="profile-streak mt-3"><i class="lucide lucide-flame text-yellow-300" aria-hidden="true"></i><span id="profileStreak">1-Day Streak</span></div></div></header>
    <main class="mx-auto -mt-5 max-w-lg space-y-3 px-3">
        <section class="profile-card p-3" aria-labelledby="loginStreakTitle"><div class="flex items-center justify-between px-1"><div class="flex items-center gap-2"><i class="lucide lucide-flame text-sm text-orange-500" aria-hidden="true"></i><h2 id="loginStreakTitle" class="text-xs font-bold">Login Streak</h2></div><span class="text-[10px] text-gray-500">This week</span></div><div id="profileWeek" class="mt-3 grid grid-cols-7 gap-2" aria-label="Weekly check-in progress"></div><p id="profileProgress" class="mt-2 text-center text-[10px] text-gray-500">Loading streak...</p></section>
        <a href="motoai.html" class="motoai-banner flex items-center gap-3 rounded-xl p-3 text-white shadow-sm" aria-label="Open MotoAI Assistant"><span class="motoai-icon"><i class="lucide lucide-message-circle text-base" aria-hidden="true"></i></span><span class="min-w-0 flex-1"><span class="flex items-center gap-2"><strong class="text-xs">MotoAI Assistant</strong><span class="ai-pill">AI</span></span><small class="mt-1 block text-[10px] text-purple-100">Ask about maintenance, schedules &amp; tips</small></span><i class="lucide lucide-chevron-right text-purple-100" aria-hidden="true"></i></a>
        <section class="profile-card overflow-hidden" aria-label="Profile settings"><a href="motorcycles.html" class="menu-row flex items-center gap-3 px-3" aria-label="My Motorcycles"><span class="menu-icon"><i class="lucide lucide-bike" aria-hidden="true"></i></span><span class="min-w-0 flex-1"><strong class="block text-xs">My Motorcycles</strong><small id="bikeCount" class="block text-[10px] text-gray-500">Loading bikes...</small></span><i class="lucide lucide-chevron-right text-xs text-gray-300" aria-hidden="true"></i></a><a href="notifications.html" class="menu-row flex items-center gap-3 px-3" aria-label="Notification Settings"><span class="menu-icon"><i class="lucide lucide-bell" aria-hidden="true"></i></span><span class="min-w-0 flex-1"><strong class="block text-xs">Notification Settings</strong><small class="block text-[10px] text-gray-500">Reminders &amp; alerts</small></span><i class="lucide lucide-chevron-right text-xs text-gray-300" aria-hidden="true"></i></a><button type="button" onclick="toggleEdit()" class="menu-row flex w-full items-center gap-3 px-3 text-left" aria-label="Account Settings"><span class="menu-icon"><i class="lucide lucide-settings" aria-hidden="true"></i></span><span class="min-w-0 flex-1"><strong class="block text-xs">Account Settings</strong><small class="block text-[10px] text-gray-500">Profile &amp; password</small></span><i class="lucide lucide-chevron-right text-xs text-gray-300" aria-hidden="true"></i></button></section>
        <button type="button" onclick="logoutUser()" class="flex w-full items-center justify-center gap-2 rounded-xl border border-red-300 bg-white py-3 text-xs font-medium text-red-500 shadow-sm" aria-label="Sign Out"><i class="lucide lucide-log-out" aria-hidden="true"></i>Sign Out</button>
    </main>
    <div id="mobileNav"></div><div id="toastContainer" class="fixed right-4 top-4 z-50 space-y-2"></div>
    <script type="module" src="./js/firebase-config.js"></script><script type="module" src="./js/mobile-nav.js"></script><script type="module" src="./js/profile.js"></script>
</body>
</html>
