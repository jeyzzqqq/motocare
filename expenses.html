<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoCare - Expense Tracker</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.16.29/font/lucide.min.css" rel="stylesheet">
    <style>
        :root { --moto-green: #2e9e4f; --moto-green-dark: #237b3c; --moto-green-soft: #dff7e6; }
        body { font-family: sans-serif; }
        .expenses-header { background: var(--moto-green); }
        .expense-stat { margin-top: -25px; position: relative; z-index: 2; }
        .expense-card { border: 1px solid #e5e7eb; border-radius: 14px; background: #fff; box-shadow: 0 2px 6px rgba(15, 23, 42, .08); }
        .expense-log-row { min-height: 62px; }
        .expense-icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto; }
        .month-bar { width: 24px; min-height: 3px; border-radius: 5px 5px 2px 2px; background: #9bd3a6; }
        .month-bar.is-latest { background: var(--moto-green-dark); }
        .progress-track { height: 4px; border-radius: 999px; background: #eef1f2; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: inherit; }
    </style>
</head>
<body class="min-h-screen bg-gray-50 pb-32 text-gray-800">
    <header class="expenses-header px-4 pb-12 pt-5 text-white">
        <div class="mx-auto max-w-lg">
            <h1 class="text-xl font-bold">Expenses</h1>
            <p id="expenseDateRange" class="mt-1 text-xs text-green-100">Loading...</p>
        </div>
    </header>

    <main class="mx-auto max-w-lg px-3">
        <section class="expense-stat grid grid-cols-2 gap-2" aria-label="Expense summary">
            <div class="expense-card p-3">
                <p class="text-[9px] font-medium uppercase tracking-wide text-gray-500">Total Spent</p>
                <p id="totalExpenses" class="mt-1 text-lg font-bold text-gray-900">Loading...</p>
                <p id="totalDateRange" class="mt-1 text-[10px] text-gray-400">Loading...</p>
            </div>
            <div class="expense-card p-3">
                <p class="text-[9px] font-medium uppercase tracking-wide text-gray-500">This Month</p>
                <p id="thisMonthExpense" class="mt-1 text-lg font-bold text-green-700">Loading...</p>
                <p id="currentMonth" class="mt-1 text-[10px] text-gray-400">Loading...</p>
            </div>
        </section>

        <section class="expense-card mt-4 p-4" aria-labelledby="monthlySpendingTitle">
            <h2 id="monthlySpendingTitle" class="text-xs font-bold">Monthly Spending</h2>
            <div id="monthlySpendingChart" class="mt-4"></div>
        </section>

        <section class="expense-card mt-3 p-4" aria-labelledby="spendingByBikeTitle">
            <h2 id="spendingByBikeTitle" class="text-xs font-bold">Spending by Bike</h2>
            <div id="bikeSpendingList" class="mt-3"></div>
        </section>

        <section class="mt-3" aria-labelledby="expenseLogTitle">
            <div class="mb-2 flex items-center justify-between">
                <h2 id="expenseLogTitle" class="text-xs font-bold">Expense Log</h2>
            </div>
            <div id="recentExpensesList" class="expense-card overflow-hidden"></div>
        </section>
    </main>

    <div id="mobileNav"></div>

    <!-- Floating Action Button -->
    <a href="add-record.html" class="fixed bottom-24 right-4 bg-green-700 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-xl hover:bg-green-800 transition-all hover:scale-110 active:scale-95 z-30">
        <i class="lucide lucide-plus text-3xl"></i>
    </a>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2 max-w-sm"></div>

    <script type="module" src="./js/firebase-config.js"></script>
    <script src="./js/utils.js"></script>
    <script type="module" src="./js/mobile-nav.js"></script>
    <script type="module" src="./js/expenses.js"></script>
</body>
</html>
