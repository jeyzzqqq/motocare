<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoCare - Dashboard</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.16.29/font/lucide.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/shared-layout.css?v=2">
    <style>
        :root { --moto-purple: #8b5cf6; }
        body { font-family: sans-serif; }
        .dashboard-list-row { min-height: 62px; }
        .dashboard-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; }
        .insight-ai-badge { width: 34px; height: 34px; color: #8b5cf6; background: #f3f0ff; }
        .insight-ai-badge svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .streak-badge { display: flex; align-items: center; gap: 8px; width: fit-content; padding: 9px 14px; border-radius: 9px; background: rgba(255, 255, 255, 0.18); }
        .streak-badge__icon { color: #ffd166; font-size: 14px; }
        .streak-badge__count { color: #fff; font-weight: 700; }
        .streak-badge__supporting { color: rgba(255, 255, 255, 0.72); font-weight: 400; }
    </style>
</head>
<body class="min-h-screen bg-gray-50 pb-32 text-gray-800">
    <header class="app-header dashboard-header">
        <div class="app-header__inner">
            <div class="app-header__top">
            <div class="app-header__title"><p id="greeting" class="text-xs font-medium text-green-100">Good morning,</p><h1 id="userName" class="mt-1 text-xl font-bold">Rider</h1></div>
            <div class="app-header__actions">
                <button id="notificationBtn" type="button" aria-label="Notifications" class="header-action"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg><span id="notificationBadge" class="notification-badge hidden"></span></button>
                <button id="logoutBtn" type="button" aria-label="Log out" class="header-action"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7" /><path d="M12 12h9M17 8l4 4-4 4" /></svg></button>
            </div>
            </div>
            <div class="app-header__second"><div class="streak-badge text-xs" aria-label="Current streak"><i class="streak-badge__icon lucide lucide-flame" aria-hidden="true"></i><span id="streakCount" class="streak-badge__count">0-Day Streak</span><span class="streak-badge__supporting">Keep it up</span></div></div>
        </div>
    </header>

    <main class="page-content">
        <section class="dashboard-stat grid grid-cols-3 gap-2" aria-label="Dashboard statistics">
            <a href="motorcycles.html" class="rounded-xl bg-white p-3 text-center shadow-md"><div class="dashboard-icon mx-auto bg-green-50 text-green-700"><span aria-hidden="true">&#127949;</span></div><p id="totalBikes" class="mt-2 text-sm font-bold">0</p><p class="text-[9px] text-gray-500">Total Bikes</p></a>
            <a href="schedule.html" class="rounded-xl bg-white p-3 text-center shadow-md"><div class="dashboard-icon mx-auto bg-yellow-100 text-orange-500"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5l3 2"></path></svg></div><p id="nextDue" class="mt-2 text-sm font-bold text-yellow-700">--</p><p class="text-[9px] text-gray-500">Next Due</p></a>
            <a href="expenses.html" class="rounded-xl bg-white p-3 text-center shadow-md"><div class="dashboard-icon mx-auto bg-blue-50 text-blue-600"><span aria-hidden="true">&#8369;</span></div><p id="monthTotal" class="mt-2 text-sm font-bold">&#8369;0</p><p class="text-[9px] text-gray-500">This Month</p></a>
        </section>

        <section class="mt-4 rounded-xl border border-purple-200 bg-[#F3F0FF] p-4" aria-labelledby="insightTitle">
            <div class="flex items-center gap-2"><div class="dashboard-icon insight-ai-badge rounded-full"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg></div><h2 id="insightTitle" class="text-xs font-bold text-purple-900">AI Maintenance Insight</h2><span class="rounded-full bg-purple-100 px-2 py-0.5 text-[8px] font-bold text-purple-700">AI</span></div>
            <p id="aiInsight" class="mt-2 text-xs leading-relaxed text-purple-900">Loading your motorcycle data...</p><a id="askMotoAi" href="motoai.html" class="mt-2 inline-flex items-center gap-1 text-[10px] font-bold text-purple-700">Ask MotoAI for details <span aria-hidden="true">&#8594;</span></a>
        </section>

        <section class="mt-5" aria-labelledby="urgentTitle"><div class="mb-2 flex items-center justify-between"><h2 id="urgentTitle" class="text-xs font-bold">Urgent Maintenance</h2><a href="schedule.html" class="text-[10px] font-semibold text-green-700">View all <span aria-hidden="true">&#8250;</span></a></div><div id="urgentMaintenanceList" class="space-y-2"><p class="py-3 text-xs text-gray-500">Loading...</p></div></section>
        <section class="mt-5" aria-labelledby="recentTitle"><div class="mb-2 flex items-center justify-between"><h2 id="recentTitle" class="text-xs font-bold">Recent Records</h2><a href="history.html" class="text-[10px] font-semibold text-green-700">View all <span aria-hidden="true">&#8250;</span></a></div><div id="recentRecordsList" class="overflow-hidden rounded-xl border border-gray-100 bg-white shadow-sm"><p class="p-4 text-xs text-gray-500">Loading...</p></div></section>
    </main>

    <div id="mobileNav"></div><div id="toastContainer" class="fixed right-4 top-4 z-50 space-y-2"></div>
    <script type="module" src="./js/firebase-config.js"></script><script src="./js/utils.js"></script><script type="module" src="./js/mobile-nav.js?v=4"></script><script type="module" src="./js/notification-panel.js?v=6"></script><script type="module" src="./js/streak-modal.js?v=2"></script><script type="module" src="./js/dashboard.js?v=8"></script>
</body>
</html>
